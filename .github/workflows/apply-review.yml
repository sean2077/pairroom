name: Apply verified review patch (temporary)

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: ['.github/workflows/apply-review.yml', '.review/polish.patch.xz.b64']

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'improve/polish-reliability-efficiency-20260905' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify and apply the locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          patch = lzma.decompress(base64.b64decode(pathlib.Path('.review/polish.patch.xz.b64').read_text()))
          expected = '289403d18e2a9bdf5176c525bb8d3f7e4ae045273f7aa7b59fdb7658ea5eb806'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch digest mismatch'
          pathlib.Path('/tmp/pairroom-polish.patch').write_bytes(patch)
          PY
          git apply --check --index --unidiff-zero /tmp/pairroom-polish.patch
          git apply --index --unidiff-zero /tmp/pairroom-polish.patch
          git rm .review/polish.patch.xz.b64
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: polish Room interaction, bounded projections, replay, and API contracts'
          git push origin HEAD:refs/heads/improve/polish-reliability-efficiency-20260905
