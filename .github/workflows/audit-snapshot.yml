name: Temporary audit snapshot

on:
  push:
    branches: ['audit/post-v5.11.1-20261002']
    paths: ['.github/workflows/audit-snapshot.yml']

permissions:
  contents: write

jobs:
  publish-reviewed-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify patch and publish only the new review branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          encoded = pathlib.Path('.github/audit-delivery.patch.xz.b64').read_bytes()
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'deb2e57dd7dda16a0fae3800f24cc1178f254d8f85be52bbf904fe2519051915'
          pathlib.Path('/tmp/pairroom-reviewed.patch').write_bytes(patch)
          PY
          base=6ee20544b2a5de9bfc0930130b0eadff8a250b9f
          branch=fix/post-v5.11.1-audit
          test "$(git rev-parse origin/main)" = "$base"
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          git worktree add -b "$branch" "$RUNNER_TEMP/pairroom-reviewed" "$base"
          cd "$RUNNER_TEMP/pairroom-reviewed"
          git apply --index --unidiff-zero /tmp/pairroom-reviewed.patch
          git diff --cached --check
          test "$(git write-tree)" = b3af1d392c8353ed7d825cb569b7b5a2e2124b46
          test -z "$(git diff --cached --name-only -- .github go.mod go.sum desktop/go.mod desktop/go.sum VERSION internal/version)"
          git -c user.name='Sean' -c user.email='37324769+sean2077@users.noreply.github.com' commit -m 'fix(agent): bound stdin writes and preserve terminal session ownership'
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-parse HEAD^{tree})" = b3af1d392c8353ed7d825cb569b7b5a2e2124b46
          git push origin "HEAD:refs/heads/$branch"
          git log -1 --format='%H %T %P'
