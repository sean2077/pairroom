name: Temporary cleanup publisher
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/cleanup-workbench.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.event.pull_request.number == 44 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/remove-obsolete-room-compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch reviewed edit bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/sean2077/pairroom/git/blobs/aa4a846f9cecd1821ed6ef6da6eed9db87fb4a49 --jq .content | base64 --decode > "$RUNNER_TEMP/cleanup-ops.xz"
      - name: Verify every source and destination before applying
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, os, subprocess
          from pathlib import Path, PurePosixPath
          data = lzma.decompress((Path(os.environ['RUNNER_TEMP']) / 'cleanup-ops.xz').read_bytes())
          assert hashlib.sha256(data).hexdigest() == '4ea0ae7a0c3b0cdc1e3f85a8bcbc4a3adff3d9f5fa3565d5e210a68724f890ff', 'edit bundle digest mismatch'
          ops = json.loads(data)
          assert len(ops) == 76
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          changes = []
          seen = set()
          for op in ops:
              path = PurePosixPath(op['path'])
              assert not path.is_absolute() and '..' not in path.parts and not any(p.startswith('.') for p in path.parts)
              assert str(path) == op['path'] and str(path) not in seen
              seen.add(str(path))
              target = Path(path)
              assert not target.is_symlink()
              old = target.read_bytes() if target.exists() else None
              assert (blob(old) if old is not None else None) == op['before'], f'source changed: {path}'
              if op['after'] is None:
                  new = None
              else:
                  lines = (old or b'').decode().splitlines(keepends=True)
                  for start, end, text in reversed(op['edits']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end] = [text]
                  new = ''.join(lines).encode()
                  assert blob(new) == op['after'], f'destination mismatch: {path}'
              changes.append((target, new))
          for target, new in changes:
              if new is None:
                  target.unlink()
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(new)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '-A', '--', *[str(p) for p, _ in changes]], check=True)
          print(f'Verified and staged {len(changes)} exact file changes')
          PY
      - name: Run current unit regressions
        run: go test -count=1 ./...
      - name: Publish only to the requested PR branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/codex/remove-obsolete-room-compat | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: finish retired Room cleanup and current-model regression coverage'
          git push origin HEAD:refs/heads/codex/remove-obsolete-room-compat
