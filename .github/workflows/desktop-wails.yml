name: Desktop (Wails v3)

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-wails.yml'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-wails.yml'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-wails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Wails desktop module
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            desktop/go.mod
            desktop/go.sum
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libgtk-4-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libwebkitgtk-6.0-dev \
            pkg-config
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Verify isolated desktop module lock
        working-directory: desktop
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test desktop host and embedded PairRoom Service
        working-directory: desktop
        run: go test -count=1 ./...
      - name: Prepare Wails packaging assets
        working-directory: desktop
        run: python scripts/prepare-build.py
      - name: Compile Linux desktop application
        working-directory: desktop
        run: wails3 task linux:build ARCH=amd64 PRODUCTION=true

  package:
    name: Package ${{ matrix.label }}
    # Installers and app bundles are release artifacts, not PR/main CI output.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-24.04
            platform: linux
            arch: amd64
          - label: windows-amd64
            os: windows-2025
            platform: windows
            arch: amd64
          - label: macos-arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - label: macos-amd64
            os: macos-15-intel
            platform: darwin
            arch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            desktop/go.mod
            desktop/go.sum
      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libgtk-4-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libwebkitgtk-6.0-dev \
            pkg-config
      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --no-progress -y
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            throw "makensis.exe was not installed below $nsis"
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Download isolated desktop module dependencies
        working-directory: desktop
        run: go mod download
      - name: Prepare Wails packaging assets
        working-directory: desktop
        run: python scripts/prepare-build.py
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: |
          wails3 task linux:create:appimage ARCH=${{ matrix.arch }}
          wails3 task linux:create:deb ARCH=${{ matrix.arch }}
      - name: Build Windows packages
        if: matrix.platform == 'windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          wails3 task windows:package ARCH=${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build macOS application bundle
        if: matrix.platform == 'darwin'
        working-directory: desktop
        run: wails3 task darwin:package ARCH=${{ matrix.arch }}
      - name: Collect final packages and checksums
        working-directory: desktop
        run: python scripts/collect-artifacts.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --label ${{ matrix.label }}
      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: pairroom-desktop-${{ matrix.label }}
          path: desktop/dist/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
