name: Diagnostics development verification
on:
  push:
    branches: ['codex/diagnostics-project-workspace']
    paths: ['.github/workflows/diagnostics-development.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/diagnostics-project-workspace
          fetch-depth: 0
      - name: Apply checksummed test fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          patch = pathlib.Path('.github/diagnostics-ci-fix.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == 'c58b34c4226d6a6394a5d29d26ece71bb5494a6bd6ff0b0959cbcdbd767d50ad', 'patch checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm .github/diagnostics-ci-fix.patch
          git add internal/service/diagnostics_test.go scripts/test_management_browser.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: respect Management routing and production CSP'
          git push origin HEAD:refs/heads/codex/diagnostics-project-workspace
