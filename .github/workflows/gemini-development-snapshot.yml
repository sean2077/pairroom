name: Gemini development snapshot

on:
  push:
    branches: [feat/gemini-cli-support]
    paths: [.github/workflows/gemini-development-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Prepare pinned offline verification inputs
        run: |
          go version
          go mod download
          tar -czf "${RUNNER_TEMP}/pairroom-go.tar.gz" -C "$(go env GOROOT)" .
          tar -czf "${RUNNER_TEMP}/pairroom-modules.tar.gz" -C "$(go env GOMODCACHE)" .
          git diff --exit-code -- go.mod go.sum
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pairroom-gemini-development-go
          path: ${{ runner.temp }}/pairroom-go.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pairroom-gemini-development-modules
          path: ${{ runner.temp }}/pairroom-modules.tar.gz
          retention-days: 1
