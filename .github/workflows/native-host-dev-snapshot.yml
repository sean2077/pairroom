name: Native host source transfer

on:
  push:
    branches: [feat/native-host-mode-spec]
    paths: [.github/workflows/native-host-dev-snapshot.yml]

permissions:
  contents: write

jobs:
  transfer:
    if: github.repository == 'sean2077/pairroom' && github.event_name == 'push' && github.ref == 'refs/heads/feat/native-host-mode-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply the hash-verified implementation to this PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)
          parent = git('rev-parse', 'HEAD^').decode().strip()
          assert parent == '8b5ef39cfc7a64e5986cae11b3bbdfff51fc0f17', parent
          assert git('diff', '--name-only', 'HEAD^', 'HEAD').decode().splitlines() == ['.github/workflows/native-host-dev-snapshot.yml']
          def blob(sha):
              req = urllib.request.Request('https://api.github.com/repos/sean2077/pairroom/git/blobs/' + sha, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'User-Agent': 'pairroom-source-transfer'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              assert payload['encoding'] == 'base64'
              data = base64.b64decode(payload['content'])
              assert hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest() == sha
              return data
          def apply(shas, digest):
              patch = lzma.decompress(b''.join(blob(sha) for sha in shas))
              assert hashlib.sha256(patch).hexdigest() == digest
              for line in patch.decode().splitlines():
                  if line.startswith('diff --git '):
                      for name in line.split()[2:]:
                          path = pathlib.PurePosixPath(name[2:])
                          assert name.startswith(('a/', 'b/')) and not path.is_absolute()
                          assert '..' not in path.parts and path.parts[0] not in ('.git', '.github')
              git('apply', '--index', '-', input=patch)
          apply([
              '1043580f5361c4eae3a62d5304fcc72ec8ea6ee3',
              'df1e0b2e525f0d23cca10d902b00b645530eb199',
              'e3b6c3bd6b00792ae2c043e91a38ddc8000f8f5a',
              '7ff2edb259153c642f9cc1361129eea68a7f5507',
              '43e0e3551fce17ac346d404b52de1fa99ba20351',
              'cc62c87a49dca4bb9b32c30aa9750487223ba651',
              '544f185ac0fb2eff3aa9d9daf520f726264c63c5',
              '5277db79ea026765f2ed68ba8bc5d281b408633e',
              'cc28178ba875e87ae4f80f78ecab99e9dd443ec5',
              'c67fe59b24be00eba229b2877dffaeaafd5d88f1',
              '9749fe52bfc577972f70253104726277b2576600',
              '5551ecf64dcd07a5c8be5a7fe512b2a59ac117bb',
          ], '7308ba918e6cc02c78b99f96acdcc4220f2563a312c326e298a2cb0c2a0196dd')
          apply(['43cbc852c029a44e9eef350ed5b9d45d0821facb', '50eb990022be5111189064d41349a69e2659b09d'],
                '295f801c58b619b25fc7d7b04b35c11afa66d3b79abc9bce51deff5eefad6141')
          git('diff', '--cached', '--check')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'feat: implement experimental Native host relay, CLI, UI and recovery contracts')
          git('push', 'origin', 'HEAD:refs/heads/feat/native-host-mode-spec')
          print('Implementation committed:', git('rev-parse', 'HEAD').decode().strip())
