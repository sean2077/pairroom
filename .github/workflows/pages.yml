name: Website

on:
  pull_request:
    paths: ['website/**', 'docs/images/**', 'desktop/assets/icon.png', 'scripts/*website*.py', 'scripts/requirements-browser.txt', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['website/**', 'docs/images/**', 'desktop/assets/icon.png', 'scripts/*website*.py', 'scripts/requirements-browser.txt', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
      - name: Validate content and public assets
        run: python scripts/check_website.py
      - name: Install development-only browser checks
        run: |
          python -m venv .browser-venv
          .browser-venv/bin/python -m pip install -r scripts/requirements-browser.txt
          .browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise the real website under its Pages subpath
        run: .browser-venv/bin/python scripts/test_website_browser.py
      - name: Retain visual verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-screenshots
          path: .browser-results/website/
          retention-days: 14
      - name: Package website only
        run: python scripts/build_website.py --output dist/website
      - name: Upload public Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/website

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
