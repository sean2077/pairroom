name: Project setup verification snapshot

on:
  push:
    branches: ['feat/project-native-setup-20261015']
    paths: ['.github/workflows/project-setup-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package tracked source for isolated offline verification
        run: git archive --format=tar.gz --output="${RUNNER_TEMP}/pairroom-source.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-setup-source
          path: ${{ runner.temp }}/pairroom-source.tar.gz
          retention-days: 1
          if-no-files-found: error
