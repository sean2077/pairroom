name: Project setup verification snapshot

on:
  push:
    branches: ['feat/project-native-setup-20261015']
    paths: ['.github/workflows/project-setup-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Prepare isolated verification tools
        shell: bash
        run: |
          go version
          go mod download
          mkdir -p "${RUNNER_TEMP}/offline"
          tar -C "$(go env GOROOT)" -czf "${RUNNER_TEMP}/offline/go.tar.gz" .
          tar -C "$(go env GOMODCACHE)" -czf "${RUNNER_TEMP}/offline/modules.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-setup-tools
          path: ${{ runner.temp }}/offline/*.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
