name: Release

on:
  push:
    tags: ['v*']

# Default to read-only; only the publish job, which runs no project code, can
# write to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build and verify release payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Verify actual Go toolchain
        run: python scripts/check_go_versions.py minimum go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
      - name: Install pinned standalone linter
        run: make lint-install
      - name: Verify tag, source version, and release notes
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "${GITHUB_REF_NAME}")"
          python3 scripts/extract-changelog.py \
            --changelog CHANGELOG.md \
            --tag "${GITHUB_REF_NAME}" \
            --output "${RUNNER_TEMP}/release-notes.md"
      - name: Build and verify release payload
        run: make release
      - name: Reject vulnerable Linux release binary
        run: make vuln-binary
      - name: Stage release notes
        run: cp "${RUNNER_TEMP}/release-notes.md" release-notes.md
      - name: Retain verified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pairroom-release-payload
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pairroom-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pairroom-release-payload
          path: dist
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pairroom-release-notes
          path: ${{ runner.temp }}
      - name: Recheck the transferred payload against its checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/release-notes.md"
          (cd dist && sha256sum -c SHA256SUMS)
          # SHA256SUMS lists every payload file; nothing may be added in transit.
          diff -u \
            <(find dist -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort) \
            <(sed 's/^[0-9a-f]\{64\}  //' dist/SHA256SUMS | LC_ALL=C sort)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PairRoom ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
      - name: Verify published release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)" = "${GITHUB_REF_NAME}"
          test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease)" = "false"
          published="${RUNNER_TEMP}/published"
          mkdir -p "${published}"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir "${published}"
          diff -u \
            <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort) \
            <(find "${published}" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          (cd "${published}" && sha256sum -c SHA256SUMS)
