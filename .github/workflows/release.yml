name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Verify tag, source version, and release notes
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "${GITHUB_REF_NAME}")"
          python3 scripts/extract-changelog.py \
            --changelog CHANGELOG.md \
            --tag "${GITHUB_REF_NAME}" \
            --output "${RUNNER_TEMP}/release-notes.md"
      - name: Build and verify release payload
        run: make release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PairRoom ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
      - name: Verify published release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)" = "${GITHUB_REF_NAME}"
          test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease)" = "false"
          published="${RUNNER_TEMP}/published"
          mkdir -p "${published}"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir "${published}"
          diff -u \
            <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort) \
            <(find "${published}" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          (cd "${published}" && sha256sum -c SHA256SUMS)
