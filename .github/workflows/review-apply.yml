name: Apply verified browser follow-up (temporary)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/review-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'improve/room-state-and-runtime-efficiency' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply verified test corrections
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: improve/room-state-and-runtime-efficiency
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/verified-product" HEAD
          cd "$RUNNER_TEMP/verified-product"
          printf '%s' '' | base64 -d | xz -dc > "$RUNNER_TEMP/followup.patch"
          printf '%s  %s\n' 'f8b4bc933ac2cb2af1983d91b0f11e4b2512b7a60753a0d5e67a3e1e22f61db8' "$RUNNER_TEMP/followup.patch" | sha256sum -c -
          git apply --unidiff-zero --check "$RUNNER_TEMP/followup.patch"
          git apply --unidiff-zero --index "$RUNNER_TEMP/followup.patch"
          git diff --cached --check
          staged_tree="$(git write-tree)"
          export GIT_INDEX_FILE="$RUNNER_TEMP/checked-product-index"
          git read-tree "$staged_tree"
          git ls-files -z .github/workflows .review | xargs -0 -r git update-index --force-remove
          test "$(git write-tree)" = 'ab22f613c60bcd1e496dc7963bf53da8babe267a'
          unset GIT_INDEX_FILE
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: make browser scroll range and panel visibility explicit'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
