name: Apply final visual regression fix (temporary)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/review-polish.yml', '.review/polish.patch']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/creation-only-collaboration-modes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply only the verified visual and deterministic-test diff
        env:
          TARGET_BRANCH: feat/creation-only-collaboration-modes
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '985f1f0a1e431a6486a57e3cd18d37f385adc6858b77f530bb8fb35aafa64b1e' '.review/polish.patch' | sha256sum -c -
          git apply --unidiff-zero --check .review/polish.patch
          git apply --unidiff-zero --index .review/polish.patch
          git diff --cached --check
          staged_tree="$(git write-tree)"
          export GIT_INDEX_FILE="$RUNNER_TEMP/product-index"
          git read-tree "$staged_tree"
          git update-index --force-remove .github/workflows/review-polish.yml .review/polish.patch
          test "$(git write-tree)" = '090cc75fce7a80bfc910f985801301f4a65011fa'
          unset GIT_INDEX_FILE
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: style permission controls and make timing-sensitive tests deterministic'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
