name: Review snapshot (temporary)

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/review-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'improve/polish-reliability-efficiency-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Export tracked source and verified public build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pairroom-review
          git archive --format=tar.gz HEAD > /tmp/pairroom-review/source.tar.gz
          git bundle create /tmp/pairroom-review/repository.bundle --all
          go mod download
          go mod verify
          tar -czf /tmp/pairroom-review/go-mod-cache.tar.gz -C "$(go env GOMODCACHE)" .
          tar -czf /tmp/pairroom-review/go-toolchain.tar.gz -C "$(go env GOROOT)" .
          (cd /tmp/pairroom-review && sha256sum *.gz repository.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: pairroom-review-snapshot
          path: /tmp/pairroom-review/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
