name: Review source (temporary)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/review-source.yml']
permissions:
  contents: read
jobs:
  export:
    if: github.head_ref == 'improve/room-state-and-runtime-efficiency' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export public tracked Git objects only
        shell: bash
        run: |
          set -euo pipefail
          git branch review-source HEAD
          git bundle create "$RUNNER_TEMP/pairroom-source.bundle" --all
          sha256sum "$RUNNER_TEMP/pairroom-source.bundle"
      - uses: actions/upload-artifact@v7
        with:
          name: pairroom-polish-source
          path: ${{ runner.temp }}/pairroom-source.bundle
          retention-days: 1
          compression-level: 0
