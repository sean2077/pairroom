name: Review source (temporary)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/review-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/creation-only-collaboration-modes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked public source only
        run: |
          mkdir -p "$RUNNER_TEMP/source-export"
          git bundle create "$RUNNER_TEMP/source-export/repository.bundle" HEAD refs/remotes/origin/main
          cd "$RUNNER_TEMP/source-export"
          sha256sum repository.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: pairroom-mode-source
          path: ${{ runner.temp }}/source-export/*
          retention-days: 1
