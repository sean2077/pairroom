name: Settings ordering development
on:
  push:
    branches: ['codex/settings-order-development']
    paths: ['.github/workflows/settings-order-development.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/settings-order-development
          fetch-depth: 0
      - name: Apply checksummed implementation in a secondary worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "${RUNNER_TEMP}/settings-order-worktree" HEAD
          cd "${RUNNER_TEMP}/settings-order-worktree"
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.github/settings-order-patch/{i}').read_text().strip() for i in range(2))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3ca8880d80205322cc7f92e18e5c81402f1aa00a93d1ce27e5b0d89f2992dbb1', 'patch checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm -r .github/settings-order-patch
          git add AGENTS.md CHANGELOG.md docs internal scripts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: unify Settings diagnostics and retain draggable navigation order'
          git push origin HEAD:refs/heads/codex/settings-order-development
          git show -s --format='%H %T' > "${RUNNER_TEMP}/settings-order-commit.txt"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Unit, race, static, format and dependency checks
        shell: bash
        run: |
          set -o pipefail
          cd "${RUNNER_TEMP}/settings-order-worktree"
          make check 2>&1 | tee "${RUNNER_TEMP}/settings-order-check.log"
      - name: Mock collaboration and recovery smoke
        shell: bash
        run: |
          set -o pipefail
          cd "${RUNNER_TEMP}/settings-order-worktree"
          make smoke 2>&1 | tee "${RUNNER_TEMP}/settings-order-smoke.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: settings-order-verification
          path: |
            ${{ runner.temp }}/settings-order-*.log
            ${{ runner.temp }}/settings-order-commit.txt
          retention-days: 1
