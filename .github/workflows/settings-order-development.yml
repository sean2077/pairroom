name: Settings ordering development
on:
  push:
    branches: ['codex/settings-order-development']
    paths: ['.github/workflows/settings-order-development.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/settings-order-development
          fetch-depth: 0
      - name: Apply regression correction in secondary worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "${RUNNER_TEMP}/settings-order-worktree" HEAD
          cd "${RUNNER_TEMP}/settings-order-worktree"
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '47d55c75cd53ace54f54eb0d3243c7c263287b38d47813a23305636c99e7be42'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git add internal/service/management_test.go scripts/test_management_order_browser.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: verify unavailable Project maintenance through new row layout'
          git push origin HEAD:refs/heads/codex/settings-order-development
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Unit, race, static, format and dependency checks
        run: cd "${RUNNER_TEMP}/settings-order-worktree" && make check
      - name: Mock collaboration and recovery smoke
        run: cd "${RUNNER_TEMP}/settings-order-worktree" && make smoke
