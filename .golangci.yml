version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    staticcheck:
      # Preserve upstream default style exclusions; quick-fix suggestions are
      # not correctness gates. ST1005 is disabled because error strings begin
      # with glossary proper nouns (Room, Service, Management Shell, Claude
      # Code, Grok, Codex, PairRoom, ...) whose casing CONTEXT.md requires.
      checks: [all, -ST1000, -ST1003, -ST1005, -ST1016, -ST1020, -ST1021, -ST1022, -QF*]
  exclusions:
    presets: []
