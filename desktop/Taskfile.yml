version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  WAILS: '{{env "PAIRROOM_WAILS" | default "wails3"}}'
  PYTHON: '{{env "PAIRROOM_DESKTOP_PYTHON" | default "python"}}'
  APP_NAME: "PairRoom"
  BIN_DIR: "bin"
  # The Desktop host embeds the PairRoom Service in-process, so the host
  # binary carries the same version ldflags as the bundled CLI; otherwise
  # the Management UI degrades to the bare semver without tag/commit detail.
  VERSION_LDFLAGS:
    sh: '"{{.PYTHON}}" scripts/version-ldflags.py'

tasks:
  build:
    summary: Builds PairRoom Desktop for the host platform
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages PairRoom Desktop for the host platform
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs PairRoom Desktop
    cmds:
      - task: "{{OS}}:run"
