version: '3'

# Build tasks follow the Wails version pinned in desktop/go.mod; Windows packaging is owned by Inno Setup.
includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}.exe
      - '"{{.PYTHON}}" scripts/build-cli.py'
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      # Default and production Windows builds are GUI-subsystem so launching
      # bin/PairRoom.exe does not allocate a log console. CONSOLE=true keeps
      # the console-subsystem binary for developer stdout.
      GUI_LDFLAG: '{{if eq .CONSOLE "true"}}{{else}} -H windowsgui{{end}}'
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s{{.GUI_LDFLAG}} {{.VERSION_LDFLAGS}}"{{else}}-buildvcs=false -gcflags=all="-l" -ldflags="{{.GUI_LDFLAG}} {{.VERSION_LDFLAGS}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'
      CONSOLE: '{{.CONSOLE | default "false"}}'

  package:
    summary: Packages the production host and CLI with Inno Setup 7
    cmds:
      - task: create:inno:installer

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - '"{{.WAILS}}" generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso'
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:inno:installer:
    summary: Creates an Inno Setup installer
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - '"{{.WAILS}}" generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/inno"'
      - '"{{.PYTHON}}" scripts/package-windows.py --arch {{.ARCH}}'
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
