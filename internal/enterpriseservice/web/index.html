<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PairRoom</title><link rel="stylesheet" href="/enterprise/assets/style.css"><script src="/enterprise/assets/app.js" defer></script></head>
<body>
<main>
<header><p class="eyebrow">PAIRROOM</p><h1>Your shared Rooms.</h1><p class="intro">Keep the conversation together while each Agent works in its own session.</p></header>
<section class="account" aria-label="Account"><div><h2>Account</h2><p id="account-state">Checking your session…</p></div><div class="actions"><a id="sign-in" href="/enterprise/auth/login" hidden>Sign in</a><button id="refresh" type="button">Refresh account</button><button id="sign-out" type="button" hidden>Sign out</button></div></section>
<section aria-labelledby="open-title"><h2 id="open-title">Open a Room</h2><form id="room-form"><label for="room-id">Room ID</label><div class="room-input"><input id="room-id" name="room" autocomplete="off" placeholder="room-…" maxlength="128" required disabled><button id="open-room" type="submit" disabled>Open Room</button></div></form><p id="status" role="status" aria-live="polite"></p></section>
<section id="room" aria-label="Room history" hidden><div class="room-heading"><h2 id="room-title">Room</h2><span id="room-sequence"></span></div><ol id="messages"></ol></section>
<noscript><p>Enable JavaScript to open Rooms and manage your session. <a href="/enterprise/auth/login">Sign in</a></p></noscript>
</main>
</body>
</html>
